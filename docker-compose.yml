version: "3.9"

# Phase 0: postgres + backend only, joined by redis in Phase 14 (rate
# limiting, docs/ARCHITECTURE.md §12) and frontend in Phase 15 (a
# production build served via nginx, per ARCHITECTURE.md §14's deployment
# shape) — `docker compose up` now brings up the whole system with no
# other manual steps. `npm run dev` on the host is still the faster loop
# while actively developing the frontend.

services:
  redis:
    image: redis:7-alpine
    container_name: resume_matcher_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    container_name: resume_matcher_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resume_matcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume_matcher}
      POSTGRES_DB: ${POSTGRES_DB:-resume_matcher}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resume_matcher}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: resume_matcher_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-resume_matcher}:${POSTGRES_PASSWORD:-resume_matcher}@postgres:5432/${POSTGRES_DB:-resume_matcher}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: resume_matcher_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
