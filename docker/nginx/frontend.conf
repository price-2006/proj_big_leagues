server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin relative paths (frontend/src/api/client.ts's baseUrl: '')
    # work identically here as they do behind Vite's dev-server proxy —
    # this is the production equivalent of vite.config.ts's proxy block.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: any non-file, non-/api route resolves to index.html so
    # client-side react-router routes (e.g. /resume/upload) work on a
    # direct load/refresh, not just via in-app navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
